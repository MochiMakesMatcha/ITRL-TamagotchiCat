    <head>
    </head>
    <body>
        Hunger: <span id="hungerBar">oooooooooo</span> <br>
        Cleanliness: <span id="cleanBar">oooooooooo</span> <br>
        Attention: <span id="attentionBar">oooooooooo</span> <br>
        Energy: <span id="energyBar">oooooooooo</span> <br>
        Cat is <span id="CatActionTicker">Idle</span> <p>
        <button onclick="feed()">Feed</button><button onclick="giveAttention()">Give Attention</button>
    </body>
    <script>
        var TickSpeed=2500;
        window.setInterval(catTick, TickSpeed);
        var hunger=100;
        var clean=100;
        var attention=100;
        var energy=100;
        var beforeHappiness=0;
        var afterHappiness=0;
        var representation=0;
        var state;
        var table={};
        var basicActions={Meow:"N", Clean:"N", Run:"N", Purr:"N", Sleep:"N", Idle:"N"};
        var ActionIndex=0;
        var weights;
        var actionBag=[];
        var actionIndex;
        var SelectedAction="meow";
        var personality=[];
        personality.push(getRandomInt(25, 45)) //set hunger personality value starts getting hungry
        personality.push(getRandomInt(10, 70)) //set cleanliness personality value starts needing to clean
        personality.push(getRandomInt(0, 50))  // set attention personality value starts needing attention
        personality.push(getRandomInt(25, 60)) // energy min
        personality.push(getRandomInt(personality[0], 90)) //set hunger personality value full
        personality.push(getRandomInt(personality[1], 90))
        personality.push(getRandomInt(personality[2], 95))
        personality.push(getRandomInt(personality[3], 75))

        function catTick(){

            if(hunger>1){
                hunger-=1;
            }else{
                hunger=0;
            };
            if(attention>2){
                attention-=2;
            }else{
                attention=0;
            };
            if(clean>1){
                clean-=1;
            }else{
                clean=0;
            };
            updateRepresentation();
            state=""                                                                //get current state
            if(hunger < personality[0]){
                state+="X"
            }else if(hunger <= personality[4]){
                state+="V"
            }else if(hunger > personality[4]){
                state+="-"
            }

            if(clean < personality[1]){
                state+="X"
            }else if(clean <= personality[5]){
                state+="V"
            }else if(clean > personality[5]){
                state+="-"
            }

            if(attention < personality[2]){
                state+="X"
            }else if(attention <= personality[6]){
                state+="V"
            }else if(attention > personality[6]){
                state+="-"
            }

            if(energy < personality[3]){
                state+="X"
            }else if(energy <= personality[7]){
                state+="V"
            }else if(energy > personality[7]){
                state+="-"
            }

            beforeHappiness=0;
            if(hunger > personality[4]){
                beforeHappiness+=personality[4];
            }else{
                beforeHappiness+=hunger;
            }

            if(clean > personality[5]){
                beforeHappiness+=personality[5];
            }else{
                beforeHappiness+=clean;
            }

            if(attention > personality[6]){
                beforeHappiness+=personality[6];
            }else{
                beforeHappiness+=attention;
            }

            if(energy > personality[7]){
                beforeHappiness+=personality[7];
            }else{
                beforeHappiness+=energy;
            }

            if(table[state]){                                                       // if this state does exist
                if(Object.values(table[state]).some((element)=>element=="N")){      // if the state's options are not fully explored
                    ActionIndex = getRandomInt(0, Object.keys(table[state]).length);   // get random move index
                    SelectedAction=Object.keys(table[state])[ActionIndex];          // get random move from index
                    table[state][SelectedAction]=0;                                 // clear chosen random move from unexplored status
                    CatAction(SelectedAction);                                      // do the random move
                }else{                                                              // if this state's options are fully explored
                    weights=Object.values(table[state])                             // get choice weights
                    while(Math.min(...weights)<1){                                  // normalize weights; while the minimum value in the array of weights is less than one
                        weights=weights.map((element)=>element+1);                  // add one to each element
                    };                                                              // finsihed normalizing
                    actionBag=[];                                                   // clear the bag of actions
                    weights.forEach((value, index)=>{                               // for each weight in array
                        for(var i=0; i<Number(value); i++){                         // while i is less than the value of each weight, with i incrementing
                            actionBag.push(Object.keys(table[state])[index]);       // add the correspoding action to the draw/bag
                        };
                    });
                    actionIndex=getRandomInt(0, actionBag.length);                     // draw a random action's index from the bag
                    SelectedAction=actionBag[actionIndex];                          // get action from its index
                    CatAction(SelectedAction);                                      // do that move


                };
            }else if(!table[state]){                                           // if this state doesn't exist in table
                table[state]={};                                               // create this state in table
                table[state]=Object.assign({},basicActions);                   // add basic actions
                actionIndex = getRandomInt(0, Object.keys(table[state]).length);  // get random move index
                SelectedAction=Object.keys(table[state])[actionIndex];         // get random move from index
                table[state][SelectedAction]=0;                                // clear chosen random move from unexplored status
                CatAction(SelectedAction);                                     // do the random move
            };

        };

        function getRandomInt(min, max){ return Math.floor(Math.random() * (max - min)) + min; }

        function CatAction(Action){
            switch(Action){
                case "Meow":
                    document.getElementById("CatActionTicker").textContent="Meowing";
                    break;
                case "Clean":
                    document.getElementById("CatActionTicker").textContent="Cleaning";
                    if(clean < 50){
                        clean += 50;
                    }else{
                        clean=100;
                    };
                    calculateHappiness();
                    break;
                case "Run":
                    document.getElementById("CatActionTicker").textContent="Running";
                    if(energy > 10){
                        energy -= 10;
                    }else{
                        energy=0;
                    };
                    calculateHappiness();
                    break;
                case "Purr":
                    document.getElementById("CatActionTicker").textContent="Purring";
                    break;
                case "Sleep":
                    document.getElementById("CatActionTicker").textContent="Sleeping";
                    if(energy < 71){
                        energy+=30
                    }else{
                        energy = 100
                    };
                    calculateHappiness();
                    break;
                case "Idle":
                    document.getElementById("CatActionTicker").textContent="Doing Nothing";
                    break;
                case undefined:
                    console.log("ok...")
            };
        };

        function calculateHappiness(){
            afterHappiness=0;
            if(hunger > personality[4]){
                afterHappiness+=personality[4];
            }else{
                afterHappiness+=hunger;
            }

            if(clean > personality[5]){
                afterHappiness+=personality[5];
            }else{
                afterHappiness+=clean;
            }

            if(attention > personality[6]){
                afterHappiness+=personality[6];
            }else{
                afterHappiness+=attention;
            }

            if(energy > personality[7]){
                afterHappiness+=personality[7];
            }else{
                afterHappiness+=energy;
            }
            updateRepresentation();
            table[state][SelectedAction]=Math.max((table[state][SelectedAction]),(afterHappiness-beforeHappiness));
        };

        function feed(){
            if(hunger < 67){
                hunger+=33;
            }else{
                hunger=100;
            };
            updateRepresentation();
            calculateHappiness();
        };

        function giveAttention(){
            if(attention < 81){
                attention+=20;
            }else{
                attention=100;
            };
            updateRepresentation();
            calculateHappiness();
        };

        function updateRepresentation(){
            representation=Math.round(hunger/10);
            document.getElementById("hungerBar").textContent="";
            for(var i=0; i<representation; i++){
                document.getElementById("hungerBar").textContent+="O";
            };
            for(var i=0; i<(10-representation); i++){
                document.getElementById("hungerBar").textContent+=".";
            };

            if(hunger < personality[0]){
                document.getElementById("hungerBar").textContent+="X"
            }else if(hunger <= personality[4]){
                document.getElementById("hungerBar").textContent+="V"
            }else if(hunger > personality[4]){
                document.getElementById("hungerBar").textContent+="-"
            }

            representation=Math.round(clean/10);
            document.getElementById("cleanBar").textContent="";
            for(var i=0; i<representation; i++){
                document.getElementById("cleanBar").textContent+="O";
            };
            for(var i=0; i<(10-representation); i++){
                document.getElementById("cleanBar").textContent+=".";
            };

            if(clean < personality[1]){
                document.getElementById("cleanBar").textContent+="X"
            }else if(clean <= personality[5]){
                document.getElementById("cleanBar").textContent+="V"
            }else if(clean > personality[5]){
                document.getElementById("cleanBar").textContent+="-"
            }

            representation=Math.round(attention/10);
            document.getElementById("attentionBar").textContent="";
            for(var i=0; i<representation; i++){
                document.getElementById("attentionBar").textContent+="O";
            };
            for(var i=0; i<(10-representation); i++){
                document.getElementById("attentionBar").textContent+=".";
            };

            if(attention < personality[2]){
                document.getElementById("attentionBar").textContent+="X"
            }else if(attention <= personality[6]){
                document.getElementById("attentionBar").textContent+="V"
            }else if(attention > personality[6]){
                document.getElementById("attentionBar").textContent+="-"
            }

            representation=Math.round(energy/10);
            document.getElementById("energyBar").textContent="";
            for(var i=0; i<representation; i++){
                document.getElementById("energyBar").textContent+="O";
            };
            for(var i=0; i<(10-representation); i++){
                document.getElementById("energyBar").textContent+=".";
            };

            if(energy < personality[3]){
                document.getElementById("energyBar").textContent+="X"
            }else if(energy <= personality[7]){
                document.getElementById("energyBar").textContent+="V"
            }else if(energy > personality[7]){
                document.getElementById("energyBar").textContent+="-"
            }
        };
    </script>
</html>
